    <path d="M794,144 q3,-7 6,0 t6,0 t6,0 t6,0 t6,0 t6,0 t6,0 t6,0 t6,0 t6,0 t6,0 t6,0 t6,0" stroke="#D9C08A" stroke-width="2" fill="none"/>
  </g>
  <!-- 话术气泡（文案给 T8 过目） -->
  <g>
    <rect x="616" y="56" width="176" height="52" rx="8" fill="#FFFDF2" stroke="#B8955A" stroke-width="1.5"/>
    <path d="M700,108 L718,108 L706,124 Z" fill="#FFFDF2" stroke="#B8955A" stroke-width="1.5"/>
    <text x="626" y="76" font-size="12" fill="#6B4A1F">风沙太大啦，</text>
    <text x="626" y="94" font-size="12" fill="#6B4A1F">先回去做任务吧！</text>
  </g>

  <!-- ===== 南缘钳制面 + 越线瞬传位置标（机制归 T8，此处只标位置） ===== -->
  <rect x="1053" y="0" width="6" height="304" fill="#FFFFFF" opacity="0.25"/>
  <line x1="1056" y1="0" x2="1056" y2="304" stroke="#FFFFFF" stroke-width="4" opacity="0.3"/>
