  <rect x="608" y="176" width="64" height="112" fill="#DBCCA8" opacity="0.25"/>
  <rect x="736" y="176" width="64" height="112" fill="#DBCCA8" opacity="0.25"/>
  <rect x="864" y="176" width="64" height="112" fill="#7A4E2A" opacity="0.22"/>
  <rect x="992" y="176" width="64" height="112" fill="#7A4E2A" opacity="0.18"/>
  <!-- 基岩暗带（y 288..304） -->
  <rect x="0" y="288" width="1600" height="16" fill="#6B5A44"/>

  <!-- 表面块下行（y 160..176，随上块深一档） -->
  <rect x="544" y="160" width="64" height="16" fill="#8A5C34"/>
  <rect x="608" y="160" width="16" height="16" fill="#C4B48B"/>
  <rect x="624" y="160" width="32" height="16" fill="#8A5C34"/>
  <rect x="656" y="160" width="32" height="16" fill="#C4B48B"/>
  <rect x="688" y="160" width="16" height="16" fill="#8A5C34"/>
  <rect x="704" y="160" width="48" height="16" fill="#C4B48B"/>
  <rect x="752" y="160" width="16" height="16" fill="#8A5C34"/>
  <rect x="768" y="160" width="192" height="16" fill="#C4B48B"/>
  <rect x="960" y="160" width="32" height="16" fill="#3E8894"/>
  <rect x="992" y="160" width="64" height="16" fill="#C4B48B"/>

  <!-- 表面块上行（y 144..160）：home 段 + 带内 32 列查表序列 + 目的地段 -->
  <rect x="0" y="144" width="544" height="16" fill="#6EBD57"/>
  <!-- 带内逐列（b0..31，查表序列：草草草草 沙草草沙 沙草沙沙 沙草沙沙 沙沙沙沙沙沙 沙沙沙沙沙沙 水水 沙沙沙沙） -->
  <g stroke="#000000" stroke-opacity="0.10" stroke-width="0.5">
    <rect x="544"  y="144" width="64"  height="16" fill="#6EBD57"/>
    <rect x="608"  y="144" width="16"  height="16" fill="#DBCCA8"/>
    <rect x="624"  y="144" width="32"  height="16" fill="#6EBD57"/>
    <rect x="656"  y="144" width="32"  height="16" fill="#DBCCA8"/>
    <rect x="688"  y="144" width="16"  height="16" fill="#6EBD57"/>
    <rect x="704"  y="144" width="48"  height="16" fill="#DBCCA8"/>
    <rect x="752"  y="144" width="16"  height="16" fill="#6EBD57"/>
    <rect x="768"  y="144" width="288" height="16" fill="#DBCCA8"/>
    <rect x="960"  y="144" width="32"  height="16" fill="#4D99A6"/>
    <rect x="992"  y="144" width="64"  height="16" fill="#DBCCA8"/>
  </g>
  <!-- 带内块界细线（纯沙长段内保留方块读感） -->
  <path d="M784,144 V160 M800,144 V160 M816,144 V160 M832,144 V160 M848,144 V160 M880,144 V160 M896,144 V160 M912,144 V160 M928,144 V160 M944,144 V160 M1008,144 V160 M1024,144 V160 M1040,144 V160" stroke="#5A4632" stroke-width="1" opacity="0.12"/>
  <!-- 沙斑 / 草残点（混铺的「斑」语言） -->
  <rect x="582" y="154" width="5" height="4" fill="#DBCCA8" opacity="0.8"/>
  <rect x="596" y="148" width="5" height="4" fill="#DBCCA8" opacity="0.8"/>
  <rect x="646" y="154" width="5" height="4" fill="#DBCCA8" opacity="0.8"/>
  <rect x="694" y="150" width="5" height="4" fill="#DBCCA8" opacity="0.8"/>
  <rect x="758" y="154" width="5" height="4" fill="#6EBD57" opacity="0.9"/>
  <rect x="774" y="150" width="5" height="4" fill="#6EBD57" opacity="0.85"/>
  <rect x="822" y="155" width="4" height="3" fill="#6EBD57" opacity="0.45"/>
  <!-- 绿洲水洼高光（b26..27） -->
  <line x1="962" y1="150" x2="990" y2="150" stroke="#7FC4CC" stroke-width="2" opacity="0.7"/>
  <!-- 砂岩露头（b23 / b25） -->
  <rect x="912" y="136" width="16" height="8" fill="#D9C08A" stroke="#B99F68" stroke-width="1"/>
  <rect x="944" y="138" width="16" height="6" fill="#D9C08A" stroke="#B99F68" stroke-width="1" opacity="0.9"/>
  <!-- 沙丘起伏线（顶面 ±1 格阶梯高差，段C） -->
  <path d="M872,144 l8,0 l4,-8 l12,0 l4,-6 l16,0 l4,6 l12,0 l4,8 l8,0 z" fill="#E8DDBC" stroke="#B8A67E" stroke-width="1"/>
  <path d="M984,144 l8,0 l4,-6 l14,0 l4,-4 l12,0 l4,4 l14,0 l4,6 l8,0 z" fill="#E8DDBC" stroke="#B8A67E" stroke-width="1" opacity="0.85"/>
  <!-- 枯灌木（b10 · 草枯先兆件） -->
  <path d="M708,144 l-3,-9 M712,144 l0,-11 M716,144 l3,-8 M710,144 l-1,-6" stroke="#8A6B42" stroke-width="1.5" fill="none"/>
  <path d="M996,144 l-2,-7 M1000,144 l0,-8 M1004,144 l2,-6" stroke="#8A6B42" stroke-width="1.5" fill="none"/>
  <!-- 仙人掌（b21 两格高；目的地内一株三格高） -->
  <g fill="#4E8B3A" stroke="#37642A" stroke-width="1">
    <rect x="886" y="118" width="8" height="26"/>
    <rect x="878" y="124" width="8" height="4"/>
    <rect x="878" y="124" width="4" height="8"/>
    <rect x="1110" y="104" width="8" height="40"/>
    <rect x="1102" y="112" width="8" height="4"/>
    <rect x="1102" y="112" width="4" height="10"/>
    <rect x="1122" y="120" width="8" height="4"/>
    <rect x="1126" y="120" width="4" height="8"/>
  </g>
  <!-- 目的地绿洲（水+沙底，沙漠建场先例做法） -->
  <rect x="1440" y="144" width="80" height="16" fill="#4D99A6"/>
  <rect x="1440" y="160" width="80" height="16" fill="#3E8894"/>
  <line x1="1446" y1="150" x2="1516" y2="150" stroke="#7FC4CC" stroke-width="2" opacity="0.6"/>

  <!-- ===== 未解锁屏障：沙暴墙（b16..19，x 800..864，横跨整条南缘） ===== -->
  <g>
    <rect x="800" y="28" width="16" height="116" fill="url(#gust)" opacity="0.92"/>
    <rect x="816" y="28" width="16" height="116" fill="url(#gust)" opacity="0.92"/>
    <rect x="832" y="28" width="16" height="116" fill="url(#gust)" opacity="0.92"/>
    <rect x="848" y="28" width="16" height="116" fill="url(#gust)" opacity="0.92"/>
    <rect x="800" y="28" width="64" height="116" fill="url(#stripe)"/>
    <!-- 墙顶翻卷沙檐 -->
    <path d="M796,34 C802,20 810,26 814,18 C820,8 828,16 832,10 C838,2 846,10 850,6 C856,2 862,8 864,14 L864,34 Z" fill="#E2D3AC" opacity="0.95"/>
    <!-- 飘散沙尾 -->
    <path d="M866,30 q28,-10 56,-4" stroke="#D9C08A" stroke-width="3" fill="none" opacity="0.55" stroke-dasharray="7 5"/>
    <path d="M860,52 q34,-2 62,10" stroke="#D9C08A" stroke-width="2.5" fill="none" opacity="0.35" stroke-dasharray="6 6"/>
