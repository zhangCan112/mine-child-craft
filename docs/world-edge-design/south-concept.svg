<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" width="1600" height="420" font-family="'Microsoft YaHei','PingFang SC',sans-serif">
  <!--
    T3 · 南向沙漠边 · 概念断面图（未解锁态 + 底部解锁态对比条）
    视向：home → 南(+z) 行走方向的侧剖断面；1 格 = 16px。
    throwaway 概念稿：结论折叠进 T3 Resolution 后本图留档，不进代码。
    分区（x 轴）：home 0..544 ｜ 过渡带 32 格 544..1056（z 128..159）｜ 目的地示意 1056..1600。
  -->
  <defs>
    <!-- 天条：左 #8FC7FF（home）→ 右 #E6D19E（沙漠）；锚点 x=544(b0) 起变、x=800(屏障)≈#BACCCE、x=1056(缘)到位 -->
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#8FC7FF"/>
      <stop offset="0.34" stop-color="#8FC7FF"/>
      <stop offset="0.50" stop-color="#BACCCE"/>
      <stop offset="0.66" stop-color="#E6D19E"/>
      <stop offset="1"    stop-color="#E6D19E"/>
    </linearGradient>
    <!-- 地平线雾带：左冷白蓝 → 右暖白沙（雾=渲染边界，MC 官方口径） -->
    <linearGradient id="fog" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#DCE9F7" stop-opacity="0.95"/>
      <stop offset="0.34" stop-color="#E2ECF3" stop-opacity="0.80"/>
      <stop offset="0.66" stop-color="#F2E8CE" stop-opacity="0.85"/>
      <stop offset="1"    stop-color="#F2E8CE" stop-opacity="0.95"/>
    </linearGradient>
    <!-- 沙暴墙柱体竖向渐变 -->
    <linearGradient id="gust" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E6D19E"/>
      <stop offset="1" stop-color="#B89A5E"/>
    </linearGradient>
    <!-- 斜纹动画（静帧示意；实施时缓慢向右上漂移——借 MC 边界墙之形） -->
    <pattern id="stripe" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="5" height="14" fill="#F2E8CE" fill-opacity="0.5"/>
    </pattern>
  </defs>

  <!-- ===== 天条（y 0..144） ===== -->
  <rect x="0" y="0" width="1600" height="144" fill="url(#sky)"/>
  <!-- 远景：带内后段雾中暖色起伏带×2（纯渐变色带，零新贴图） -->
  <path d="M864,142 q40,-14 90,-10 q50,4 102,-8 l0,18 l-192,0 z" fill="#DCC9A0" opacity="0.35"/>
  <path d="M900,142 q40,-8 80,-6 q40,2 76,-4 l0,10 l-156,0 z" fill="#C9AE7C" opacity="0.4"/>
  <!-- 目的地沙丘剪影×2（大件深色，雾中显影） -->
  <path d="M1330,142 q60,-30 120,-26 q70,4 150,-14 l0,40 l-270,0 z" fill="#DCC9A0" opacity="0.5"/>
  <path d="M1380,142 q50,-18 110,-14 q60,4 110,-6 l0,16 l-220,0 z" fill="#C9AE7C" opacity="0.75"/>
  <!-- 目的地剪影：沙漠神殿（传送后实见；未解锁≈不可见） -->
  <path d="M1180,142 L1250,58 L1320,142 Z" fill="#8A744A" opacity="0.45"/>
  <path d="M1236,142 L1250,100 L1264,142 Z" fill="#6B5A3A" opacity="0.6"/>
  <line x1="1204" y1="96" x2="1296" y2="96" stroke="#7A6440" stroke-width="2" opacity="0.5"/>
  <!-- 雾带（地平线上 26px） -->
  <rect x="0" y="118" width="1600" height="26" fill="url(#fog)"/>

  <!-- ===== 天条标注 ===== -->
  <text x="16" y="16" font-size="15" font-weight="bold" fill="#1F3E5C">南向沙漠边 · 过渡带概念断面（未解锁态）—— 视向：home → 南(+z) ｜ 1 格 = 16px</text>
  <text x="1584" y="16" font-size="10" fill="#2A4A6A" text-anchor="end">T3 · designer·南 · 概念稿(throwaway) · 2026-11-06</text>
  <text x="16" y="56" font-size="11" fill="#1F3E5C">天/雾渐变：带起点 b0 即开始 lerp —— 天色先行于脚下块变化（MC「温度→天色」官方同构）</text>
  <!-- 天/雾锚点：三角 + hex -->
  <path d="M539,138 l10,0 l-5,7 z" fill="#1F3E5C" opacity="0.85"/>
  <path d="M795,138 l10,0 l-5,7 z" fill="#1F3E5C" opacity="0.85"/>
  <path d="M1051,138 l10,0 l-5,7 z" fill="#1F3E5C" opacity="0.85"/>
  <text x="520" y="130" font-size="10" fill="#1F3E5C">#8FC7FF</text>
  <text x="764" y="130" font-size="10" fill="#1F3E5C">#BACCCE 沙暴天</text>
  <text x="1066" y="130" font-size="10" fill="#1F3E5C">#E6D19E ＝ 票面端点(0.90,0.82,0.62)</text>
  <text x="868" y="104" font-size="10" fill="#2A4A6A">远景：雾中暖色起伏带×2（渐变色带 · 零新贴图）</text>
  <text x="1332" y="70" font-size="10" fill="#2A4A6A">目的地剪影：沙漠神殿（传送后实见 · 未解锁≈不可见）</text>
  <!-- 屏障标注 -->
  <text x="664" y="42" font-size="11" fill="#1F3E5C">未解锁屏障：沙暴墙（特效件 · 非方块＝不可挖 · 斜纹缓漂动画 · 借 MC 边界墙「形」无伤害「罚」）</text>
  <line x1="806" y1="46" x2="816" y2="26" stroke="#3A3A3A" stroke-width="1" opacity="0.5"/>

  <!-- ===== 目的地地面罩（未解锁的朦胧感，天条不罩） ===== -->
  <rect x="1056" y="144" width="544" height="160" fill="#F2E8CE" opacity="0.28"/>

  <!-- ===== 断面地块 ===== -->
  <!-- 地下层（y 176..288） -->
  <rect x="0" y="176" width="544" height="64" fill="#8A5C34"/>
  <rect x="0" y="240" width="544" height="48" fill="#7A4E2A"/>
  <rect x="544" y="176" width="192" height="112" fill="#96703F"/>
  <rect x="736" y="176" width="128" height="112" fill="#A5824F"/>
  <rect x="864" y="176" width="192" height="112" fill="#C4B48B"/>
  <rect x="1056" y="176" width="544" height="64" fill="#C9B98F"/>
  <rect x="1056" y="240" width="544" height="48" fill="#B8A67E"/>
