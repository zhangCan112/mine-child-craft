  <text x="560" y="318" font-size="11" fill="#3A3A3A">带宽定稿 32 格（z 128..159）· 带内可挖可建（T6 v2）· 唯一保护件＝沙暴墙（不可挖/不可替换）</text>
  <text x="560" y="334" font-size="11" fill="#3A3A3A">块序列（查表定稿 · 保建场确定性）：草×4 → 沙斑渐密(→60%) → 混匀(草残25%) → 纯沙 → 砂岩/仙人掌/绿洲 → 沙丘起伏 → 缘</text>
