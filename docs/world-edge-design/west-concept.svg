<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" shape-rendering="crispEdges" font-family="system-ui, 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <!-- ============================================================
       西向沼泽边 · 像素断面概念图（T4 designer·西，2026-11-06）
       统一构图 1600×420，每格 16px。横向 100 列 = 视角示意：
         列 0~35   home 草原
         列 36~67  过渡带（32 格，带宽定稿）
         列 68     传送线（越线即传，T8 实现，此处只示意）
         列 68~99  雾区（传送线以西的沼泽世界暗示，无裸断面）
       主视图 = 未解锁态（屏障可见）；
       底部窄横带 = 解锁态同视角对比。
       颜色：home 草#6EBD57 天#8FC7FF / 沼泽地表#4D753D 天#9EA8A3
             水洼#597A6B 深水#3E5A4D 雾#BCC5BF
       ============================================================ -->
  <defs>
    <!-- 天条横向渐变：stops 即天色锚点（0%=带前 36 格，28%=带前 8 格起变，56%=屏障处基本到位） -->
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#8FC7FF"/>
      <stop offset="0.28" stop-color="#8AC0F4"/>
      <stop offset="0.44" stop-color="#93B3D8"/>
      <stop offset="0.56" stop-color="#9EA8A3"/>
      <stop offset="1"    stop-color="#9EA8A3"/>
    </linearGradient>
    <!-- 雾罩横向渐变：opacity 阶梯=雾浓度锚点（屏障处最浓，传送线以西全雾） -->
    <linearGradient id="fog" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#BCC5BF" stop-opacity="0"/>
      <stop offset="0.30" stop-color="#BCC5BF" stop-opacity="0.08"/>
      <stop offset="0.42" stop-color="#BCC5BF" stop-opacity="0.30"/>
      <stop offset="0.49" stop-color="#BCC5BF" stop-opacity="0.70"/>
      <stop offset="0.52" stop-color="#BCC5BF" stop-opacity="0.88"/>
      <stop offset="0.60" stop-color="#BCC5BF" stop-opacity="0.80"/>
      <stop offset="0.68" stop-color="#BCC5BF" stop-opacity="0.95"/>
      <stop offset="0.76" stop-color="#BCC5BF" stop-opacity="1"/>
      <stop offset="1"    stop-color="#BCC5BF" stop-opacity="1"/>
    </linearGradient>
    <!-- 泥层横向渐变：草原泥 → 沼泽暗泥 -->
    <linearGradient id="dirt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#7B5B3A"/>
      <stop offset="0.36" stop-color="#6E5A3C"/>
      <stop offset="0.68" stop-color="#5B6B4C"/>
      <stop offset="1"    stop-color="#4E5F42"/>
    </linearGradient>
    <!-- 深层横向渐变 -->
    <linearGradient id="deep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#4A3A28"/>
      <stop offset="0.36" stop-color="#423528"/>
      <stop offset="0.68" stop-color="#38452F"/>
      <stop offset="1"    stop-color="#2F3B28"/>
    </linearGradient>
  </defs>

  <!-- 底色 -->
  <rect x="0" y="0" width="1600" height="420" fill="#EDEFEA"/>

  <!-- 标题 -->
  <text x="16" y="20" font-size="17" fill="#2F3B37" font-weight="bold">西向沼泽边 · 概念图（主视图=未解锁态 · 底部窄带=解锁态同视角）｜T4 designer·西 2026-11-06</text>

  <!-- ======================= 主视图（未解锁态） ======================= -->

  <!-- 顶天条：左 #8FC7FF → 右 #9EA8A3 -->
  <rect x="0" y="26" width="1600" height="102" fill="url(#sky)"/>

  <!-- 天条内标注（天/雾两端 hex + 天色先行） -->
  <text x="12" y="44" font-size="13" fill="#1F3A5F">home 天 #8FC7FF</text>
  <text x="1588" y="44" font-size="13" fill="#2F3B37" text-anchor="end">沼泽天 #9EA8A3</text>
  <text x="470" y="44" font-size="13" fill="#2A4464">天色先行：进带前 8 格即开始变（stops=锚点）</text>

  <!-- 引线标注：屏障 / 远景木屋 / 传送线 / 雾即尽头 -->
  <text x="824" y="66" font-size="14" fill="#4A3B2A" text-anchor="middle" font-weight="bold">未解锁屏障：迷雾深水带（水洼连片 6 格 + 苔石冒头 + 横雾带）</text>
  <line x1="824" y1="70" x2="824" y2="118" stroke="#4A3B2A" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="1290" y="88" font-size="14" fill="#26352D" text-anchor="middle" font-weight="bold">远景：高脚木屋剪影（雾中显影 · 大件深色 + 暖窗光）</text>
  <line x1="1284" y1="92" x2="1268" y2="104" stroke="#26352D" stroke-width="1" stroke-dasharray="3 4"/>
  <text x="1120" y="108" font-size="13" fill="#3A4A40" text-anchor="middle">传送线 · 越线即传（T8）</text>
  <text x="1480" y="66" font-size="13" fill="#3A4A40" text-anchor="middle">雾 = 尽头，无裸露断面</text>

  <!-- ========== 远景层：高脚木屋剪影（画在雾罩之下先铺，雾罩后再补一次淡影=显影感） ========== -->
  <g opacity="0.9">
    <!-- 桩柱 ×3（原木 5） -->
    <rect x="1216" y="128" width="16" height="48" fill="#2F4038"/>
    <rect x="1264" y="128" width="16" height="48" fill="#2F4038"/>
    <rect x="1312" y="128" width="16" height="48" fill="#2F4038"/>
    <!-- 屋身（木板 6） -->
    <rect x="1200" y="96" width="112" height="32" fill="#2F4038"/>
    <!-- 屋顶 -->
    <rect x="1208" y="88" width="96" height="8"  fill="#26352D"/>
    <rect x="1216" y="80" width="80" height="8"  fill="#26352D"/>
    <rect x="1232" y="72" width="48" height="8"  fill="#26352D"/>
    <!-- 暖窗光（友好点，不是鬼火） -->
    <rect x="1248" y="104" width="10" height="10" fill="#E8C86A"/>
  </g>

  <!-- ========== 断面地块：地表行 y176~192 · 泥层 y192~222 · 深层 y222~266 ========== -->
  <!-- 深层与泥层（横向渐变一次铺） -->
  <rect x="0" y="222" width="1600" height="44" fill="url(#deep)"/>
  <rect x="0" y="192" width="1600" height="30" fill="url(#dirt)"/>

  <!-- 草原段（列 0~35）：草 #6EBD57；列 32 起草色微暗=色彩先行示意 -->
  <rect x="0"   y="176" width="512" height="16" fill="#6EBD57"/>
  <rect x="512" y="176" width="64"  height="16" fill="#66B551"/>

  <!-- patch①（列 36~39）草掺泥斑：4 格掺 1 格泥（25%） -->
  <rect x="576" y="176" width="64" height="16" fill="#6EBD57"/>
  <rect x="592" y="176" width="16" height="16" fill="#7B5B3A"/>

  <!-- patch②（列 40~43）泥地+水洼初现：泥为主嵌 1 格草斑 + 1 处水洼 -->
  <rect x="640" y="176" width="16" height="16" fill="#6EBD57"/>
  <rect x="656" y="176" width="48" height="16" fill="#7B5B3A"/>
  <rect x="664" y="180" width="32" height="12" fill="#597A6B"/>
  <rect x="664" y="180" width="32" height="2"  fill="#7B9A8B"/>

  <!-- patch③（列 44~48）水洼渐密：全泥 + 两处水洼（列 48=屏障东岸泥柱） -->
  <rect x="704" y="176" width="80" height="16" fill="#7B5B3A"/>
  <rect x="704" y="180" width="32" height="12" fill="#597A6B"/>
  <rect x="704" y="180" width="32" height="2"  fill="#7B9A8B"/>
  <rect x="752" y="180" width="32" height="12" fill="#597A6B"/>
  <rect x="752" y="180" width="32" height="2"  fill="#7B9A8B"/>

  <!-- 屏障段（列 49~54）迷雾深水带：连片深水贯穿，不可绕不可挖（T6 禁挖禁建覆盖） -->
  <rect x="784" y="176" width="96" height="16" fill="#3E5A4D"/>
  <rect x="784" y="176" width="96" height="3"  fill="#5E7A6C"/>
  <!-- 气泡 ×3（圆点小泡，可爱不吓人） -->
  <circle cx="808" cy="182" r="3" fill="#DCE8E2" opacity="0.7"/>
  <circle cx="836" cy="185" r="2" fill="#DCE8E2" opacity="0.6"/>
  <circle cx="860" cy="181" r="3" fill="#DCE8E2" opacity="0.7"/>
  <!-- 苔石冒头 ×2（T_MOSSY） -->
  <rect x="808" y="164" width="16" height="16" fill="#6E7B6A"/>
  <rect x="812" y="168" width="6"  height="6"  fill="#4D753D"/>
  <rect x="840" y="164" width="16" height="16" fill="#6E7B6A"/>
  <rect x="844" y="166" width="5"  height="5"  fill="#4D753D"/>

  <!-- patch⑤（列 55~58）泥+苔石+兰花：西岸泥柱 + 苔石斑 + 兰花 -->
  <rect x="880" y="176" width="64" height="16" fill="#7B5B3A"/>
  <rect x="880" y="176" width="16" height="16" fill="#6B5238"/>
  <rect x="896" y="176" width="16" height="16" fill="#6E7B6A"/>
  <rect x="900" y="180" width="6"  height="6"  fill="#4D753D"/>
  <!-- 兰花 B_ORCHID（示意色，实际以图集贴图为准） -->
  <rect x="921" y="168" width="2"  height="8"  fill="#3E5A35"/>
  <rect x="916" y="162" width="10" height="8"  fill="#7B68B5"/>
  <rect x="920" y="165" width="4"  height="3"  fill="#EDEFEA"/>

  <!-- patch⑥（列 59~62）沼泽地表+水洼 -->
  <rect x="944" y="176" width="64" height="16" fill="#4D753D"/>
  <rect x="944" y="180" width="32" height="12" fill="#597A6B"/>
  <rect x="944" y="180" width="32" height="2"  fill="#7B9A8B"/>
  <rect x="992" y="180" width="16" height="12" fill="#597A6B"/>
  <rect x="992" y="180" width="16" height="2"  fill="#7B9A8B"/>

  <!-- patch⑦（列 63~67）沼泽纯色 → 渐入雾 -->
  <rect x="1008" y="176" width="80" height="16" fill="#4D753D"/>
  <rect x="1024" y="180" width="32" height="12" fill="#597A6B"/>
  <rect x="1024" y="180" width="32" height="2"  fill="#7B9A8B"/>
  <!-- 沼泽段第二株兰花 -->
  <rect x="1069" y="168" width="2"  height="8"  fill="#3E5A35"/>
  <rect x="1064" y="162" width="10" height="8"  fill="#7B68B5"/>
  <rect x="1068" y="165" width="4"  height="3"  fill="#EDEFEA"/>

  <!-- 雾区地表（列 68~99）：地形色已被雾罩吃掉，铺同色雾底保证无裸断面 -->
  <rect x="1088" y="176" width="512" height="16" fill="#BCC5BF"/>

  <!-- 传送线（列 68 西缘）：细点线示意，机制归 T8 -->
  <line x1="1088" y1="110" x2="1088" y2="266" stroke="#5A6B60" stroke-width="2" stroke-dasharray="4 8" opacity="0.7"/>

  <!-- 雾罩：横向 opacity 阶梯（屏障处最浓 → 传送线以西全雾） -->
  <rect x="0" y="110" width="1600" height="156" fill="url(#fog)"/>

  <!-- 雾中显影：木屋剪影淡影再描一遍（穿雾可见 = 大件深色，调研信标先例） -->
  <g opacity="0.55">
    <rect x="1216" y="128" width="16" height="48" fill="#26352D"/>
    <rect x="1264" y="128" width="16" height="48" fill="#26352D"/>
    <rect x="1312" y="128" width="16" height="48" fill="#26352D"/>
    <rect x="1200" y="96"  width="112" height="32" fill="#26352D"/>
    <rect x="1208" y="88"  width="96"  height="8"  fill="#1F2A24"/>
    <rect x="1216" y="80"  width="80"  height="8"  fill="#1F2A24"/>
    <rect x="1232" y="72"  width="48"  height="8"  fill="#1F2A24"/>
    <rect x="1248" y="104" width="10"  height="10" fill="#E8C86A" opacity="0.9"/>
  </g>

  <!-- 屏障专属横雾带（加浓，罩住对岸制造「看得见过不去」） -->
  <rect x="760" y="118" width="144" height="58" fill="#C9D2CC" opacity="0.85"/>
  <rect x="736" y="118" width="24"  height="58" fill="#C9D2CC" opacity="0.45"/>
  <rect x="904" y="118" width="24"  height="58" fill="#C9D2CC" opacity="0.45"/>

  <!-- 玩家小人（列 20，站在草原侧朝西走） -->
  <g fill="#2B2B33">
    <rect x="318" y="146" width="12" height="12"/>
    <rect x="316" y="158" width="16" height="14"/>
    <rect x="318" y="172" width="4"  height="4"/>
    <rect x="326" y="172" width="4"  height="4"/>
  </g>

  <!-- ========== 主视图块序列标注（两层交错 + 带宽括号） ========== -->
  <!-- 引线小竖线 -->
  <g stroke="#5A6B60" stroke-width="1">
    <line x1="600"  y1="192" x2="600"  y2="264"/>
    <line x1="668"  y1="192" x2="668"  y2="284"/>
    <line x1="720"  y1="192" x2="720"  y2="264"/>
    <line x1="832"  y1="192" x2="832"  y2="284"/>
    <line x1="904"  y1="192" x2="904"  y2="264"/>
    <line x1="968"  y1="192" x2="968"  y2="284"/>
    <line x1="1044" y1="192" x2="1044" y2="264"/>
  </g>
  <!-- 第一层（y272） -->
  <g font-size="13" fill="#2F3B37" text-anchor="middle">
    <text x="592"  y="272">① 草掺泥斑（25%）</text>
    <text x="728"  y="272">③ 水洼渐密</text>
    <text x="904"  y="272">⑤ 泥+苔石+兰花</text>
    <text x="1052" y="272">⑦ 沼泽纯色→渐雾</text>
  </g>
  <!-- 第二层（y292） -->
  <g font-size="13" fill="#2F3B37" text-anchor="middle">
    <text x="656"  y="292">② 泥地+水洼初现</text>
    <text x="840"  y="292">④ 迷雾深水带 6 格（屏障）</text>
    <text x="964"  y="292">⑥ 沼泽地表+水洼</text>
  </g>
  <!-- 带宽括号 -->
  <g stroke="#2F3B37" stroke-width="1.5" fill="none">
    <line x1="576"  y1="306" x2="700"  y2="306"/>
    <line x1="964"  y1="306" x2="1088" y2="306"/>
    <line x1="576"  y1="300" x2="576"  y2="312"/>
    <line x1="1088" y1="300" x2="1088" y2="312"/>
  </g>
  <text x="832" y="311" font-size="14" fill="#2F3B37" text-anchor="middle" font-weight="bold">过渡带宽 32 格 = 8 个 4 格 patch（东→西 patch①→⑦）</text>

  <!-- ======================= 解锁态窄横带（同视角对比） ======================= -->
  <text x="16" y="336" font-size="14" fill="#2F3B37" font-weight="bold">解锁态（同视角对比）：迷雾散去，深水化作泥岸步道，一路畅通到传送线</text>

  <!-- 窄天条（同渐变） -->
  <rect x="0" y="344" width="1600" height="24" fill="url(#sky)"/>
  <!-- 窄深层 -->
  <rect x="0" y="384" width="1600" height="12" fill="url(#deep)"/>

  <!-- 窄地表行 y368~384 -->
  <rect x="0"    y="368" width="512" height="16" fill="#6EBD57"/>
  <rect x="512"  y="368" width="64"  height="16" fill="#66B551"/>
  <rect x="576"  y="368" width="64"  height="16" fill="#6EBD57"/>
  <rect x="592"  y="368" width="16"  height="16" fill="#7B5B3A"/>
  <rect x="640"  y="368" width="16"  height="16" fill="#6EBD57"/>
  <rect x="656"  y="368" width="48"  height="16" fill="#7B5B3A"/>
  <rect x="664"  y="372" width="32"  height="12" fill="#597A6B"/>
  <rect x="704"  y="368" width="80"  height="16" fill="#7B5B3A"/>
  <rect x="704"  y="372" width="32"  height="12" fill="#597A6B"/>
  <!-- 屏障位置=泥岸步道：泥底 + 苔石垫脚（列 50/52/54）+ 残留小水洼 -->
  <rect x="784"  y="368" width="96"  height="16" fill="#7B5B3A"/>
  <rect x="784"  y="372" width="16"  height="12" fill="#597A6B"/>
  <rect x="800"  y="368" width="16"  height="16" fill="#6E7B6A"/>
  <rect x="832"  y="368" width="16"  height="16" fill="#6E7B6A"/>
  <rect x="864"  y="368" width="16"  height="16" fill="#6E7B6A"/>
  <rect x="880"  y="368" width="64"  height="16" fill="#7B5B3A"/>
  <rect x="896"  y="368" width="16"  height="16" fill="#6E7B6A"/>
  <rect x="921"  y="360" width="2"   height="8"  fill="#3E5A35"/>
  <rect x="916"  y="354" width="10"  height="8"  fill="#7B68B5"/>
  <rect x="944"  y="368" width="64"  height="16" fill="#4D753D"/>
  <rect x="944"  y="372" width="32"  height="12" fill="#597A6B"/>
  <rect x="1008" y="368" width="80"  height="16" fill="#4D753D"/>
  <rect x="1024" y="372" width="32"  height="12" fill="#597A6B"/>
  <!-- 雾区地表 -->
  <rect x="1088" y="368" width="512" height="16" fill="#BCC5BF"/>
  <!-- 传送线 -->
  <line x1="1088" y1="344" x2="1088" y2="396" stroke="#5A6B60" stroke-width="2" stroke-dasharray="4 8" opacity="0.7"/>
  <!-- 窄带雾罩：解锁后雾减半 -->
  <rect x="0" y="344" width="1600" height="52" fill="url(#fog)" opacity="0.45"/>
  <!-- 窄带玩家小人：走到了沼泽段尽头 -->
  <g fill="#2B2B33">
    <rect x="1022" y="338" width="12" height="12"/>
    <rect x="1020" y="350" width="16" height="14"/>
    <rect x="1022" y="364" width="4"  height="4"/>
    <rect x="1030" y="364" width="4"  height="4"/>
  </g>

  <!-- 窄带标注 -->
  <g font-size="13" fill="#2F3B37" text-anchor="middle">
    <text x="832" y="414">深水→泥岸步道（苔石垫脚）· 雾散 · 屏障件同格位替换</text>
    <text x="1200" y="414">畅通至传送线（越线即传，T8）</text>
  </g>
</svg>
